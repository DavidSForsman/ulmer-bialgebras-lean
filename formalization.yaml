# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4). Generated by the release build of the development repository.
version: "v0.4"

project:
  name: "ulmer-bialgebras-lean"
  description: >-
    Formalization in Lean 4 and Mathlib of the paper 'A Syntactic Approach to Ulmer's
    Bialgebras': 2-categorical syntax for algebraic and coalgebraic structures, enriched
    categories of models, lifting of limits and colimits, monadicity, orthogonal factorization
    systems, and bi-dense subcategories in 2-categories with PIE limits.
  authors:
    - "David Forsman"
  license: "Apache-2.0"
  responsible_maintainers:
    - "David Forsman"

classification:
  arxiv: ["math.CT"]
  msc2020: ["18C10", "18N10", "18A32", "18C15", "18C35", "18C40", "18E08", "16T05"]

sources:
  - title: "A Syntactic Approach to Ulmer's Bialgebras"
    authors:
      - "David Forsman"
    id: "arXiv:2607.19587"
    type: "paper"
    location: "https://arxiv.org/abs/2607.19587"
    relationship: "formalizes"
    license: "CC-BY-4.0"
    author_endorsement: "participated"

status:
  scope: >-
    175 checked statements (127 for the paper's numbered results,
    48 others), exported at commit 9e9491abe72d2b97637162feea52474234db274b. It holds every checked statement of the development.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  # Palomar: one entry per method used (manual, copilot, agent, autonomous, other).
  methods:
    - method: "agent"
      models:
        - "Claude (Anthropic)"
        - "Codex (OpenAI)"
        - "Antigravity (Google)"
        - "DeepSeek"
        - "Aristotle (Harmonic)"
      framework: "Claude Code, Codex CLI and Antigravity, coordinated through a shared Git branch of task files, logs and pull requests"
      tool_setup: "Each agent worked on its own branches; every change went in by pull request; local and cloud CI; merge trains; second reviews by an agent of a different system"
      cost:
        wall_time: "not disclosed"
        spend_usd: "about 160 (about 145 EUR)"
        hardware: "not disclosed"
      prompting_notes: "Tasks were written against the paper; statements were read against the paper by readers from different systems; non-vacuity and specialization tests; Lean's Comparator and an axiom check"
  spend_usd: "about 160 (about 145 EUR)"

fidelity:
  divergences: >-
    Every known divergence from the paper is listed in CHALLENGE.md ("How the statements
    compare with the paper") and in the Fidelity column of docs/PAPER_MAP.md.

review:
  status: >-
    The author reviewed every definition and every statement against the paper: all 175 checked statements (the 32 statements of the paper's 13 main results, and 143 more) and the definitions they are stated with, the paper's numbered definitions among them. `docs/STATE.yml` records the approval statement by statement: an entry with checked statements is `approved: true` when the author approved all of them; an entry for one of the paper's definitions has no checked statement of its own.
  reviewers:
    - "David Forsman"
  notes: >-
    scripts/check_axioms.py and Lean's Comparator (comparator.all.json) check that
    Companion.Proofs proves exactly the statements of Companion.Statements with the standard
    axioms.

