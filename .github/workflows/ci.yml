# Builds the formalization and runs the checks of README.md ("How to check it").
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Mathlib's prebuilt files
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Axioms
        run: |
          python3 scripts/check_axioms.py | tee axioms.out
          grep -q " 0 open (sorry), 0 with other axioms" axioms.out

      - name: Compiled types
        run: lake env lean scripts/check_compiled_types.lean

      # Lean's Comparator (`lake comparator`, part of Lake) rebuilds the statements and the proofs
      # (the two modules of comparator.all.json) in a bubblewrap sandbox and checks every theorem of
      # comparator.all.json with the kernel. Ubuntu 24.04 runners forbid unprivileged user
      # namespaces by default, which bwrap needs.
      - name: Comparator
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          export PATH="$(lean --print-prefix)/bin:$PATH"
          lake comparator --config comparator.all.json
